<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Privé — settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8B9CFF}a:hover{color:#B3BFFF}
</style>
</helmet>
<div style="width: 100%; min-height: 800px; box-sizing: border-box; background: #0F1013; font-family: Inter, system-ui, sans-serif; color: #ECEDF0; display: flex; flex-wrap: wrap">

  <nav aria-label="{{t.sections}}" style="flex: 1 1 220px; max-width: 260px; min-width: 200px; background: #131418; border-right: 1px solid #22252C; padding: 24px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; color: #A0A3AD; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      {{t.back}}
    </a>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <span style="display: block; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: {{n.weight}}; background: {{n.bg}}; color: {{n.fg}}">{{n.label}}</span>
    </sc-for>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; max-width: 880px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{t.title}}</h1>

    <section aria-labelledby="lang-h" style="display: flex; flex-direction: column; gap: 12px">
      <div>
        <h2 id="lang-h" style="margin: 0; font-size: 15px; font-weight: 600">{{t.language}}</h2>
        <p style="margin: 4px 0 0; font-size: 13px; color: #A0A3AD">{{t.languageHint}}</p>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
          <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid {{l.border}}; background: {{l.bg}}; color: #ECEDF0; font: 500 14px Inter, system-ui, sans-serif; cursor: pointer">{{l.label}}</button>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="theme-h" style="display: flex; flex-direction: column; gap: 12px">
      <h2 id="theme-h" style="margin: 0; font-size: 15px; font-weight: 600">{{t.theme}}</h2>
      <div style="display: inline-flex; align-self: flex-start; padding: 4px; border-radius: 12px; background: #1B1D23; gap: 4px">
        <sc-for list="{{themes}}" as="th" hint-placeholder-count="3">
          <button type="button" onClick="{{th.pick}}" aria-pressed="{{th.pressed}}" style="height: 34px; padding: 0 16px; border-radius: 9px; border: none; background: {{th.bg}}; color: {{th.fg}}; font: 500 13px Inter, system-ui, sans-serif; cursor: pointer">{{th.label}}</button>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="acc-h" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <h2 id="acc-h" style="margin: 0; font-size: 15px; font-weight: 600">{{t.accounts}}</h2>
        <a href="AddAccount.dc.html" style="height: 34px; padding: 0 14px; border-radius: 10px; background: #8B9CFF; color: #0B0C10; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center">{{t.addAccount}}</a>
      </div>
      <div style="border: 1px solid #22252C; border-radius: 14px; overflow: hidden">
        <sc-for list="{{accounts}}" as="a" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: {{a.divider}}; flex-wrap: wrap">
            <span style="width: 36px; height: 36px; border-radius: 10px; background: {{a.color}}; color: #0B0C10; font-weight: 700; display: flex; align-items: center; justify-content: center">{{a.initial}}</span>
            <span style="flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 600">{{a.label}}</span>
              <span style="font-size: 12px; color: #A0A3AD">{{a.net}} · {{a.remote}}</span>
            </span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A0A3AD">
              <span style="width: 8px; height: 8px; border-radius: 50%; background: {{a.stateColor}}"></span>{{a.state}}
            </span>
            <button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1.5px solid #6B6F7A; background: transparent; color: #ECEDF0; font: 600 12px Inter, system-ui, sans-serif; cursor: pointer">{{t.rename}}</button>
            <button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1.5px solid #F2A0A8; background: transparent; color: #F2A0A8; font: 600 12px Inter, system-ui, sans-serif; cursor: pointer">{{t.logout}}</button>
          </div>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="priv-h" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; background: #131418; border: 1px solid #22252C">
      <h2 id="priv-h" style="margin: 0; font-size: 15px; font-weight: 600">{{t.privacy}}</h2>
      <sc-for list="{{privacy}}" as="p" hint-placeholder-count="3">
        <span style="display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #C7C9D0; line-height: 1.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5ED3B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px; margin-top: 2px"><path d="m5 12 5 5 9-10"></path></svg>
          {{p.text}}
        </span>
      </sc-for>
      <span style="font-size: 12px; color: #868A95">{{t.dataPath}} <code style="font-family: ui-monospace, Menlo, monospace; color: #C7C9D0">~/Library/Application Support/Prive</code></span>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'en', theme: 'system' };
  }

  dict() {
    return {
      en: {
        sections: 'Settings sections', back: 'Back to inbox', title: 'Settings',
        nav: ['General', 'Accounts', 'Privacy', 'About'],
        language: 'Language', languageHint: 'Defaults to your system language. Saved only on this computer.',
        system: 'System default', theme: 'Theme', themes: ['System', 'Light', 'Dark'],
        accounts: 'Accounts', addAccount: 'Add account', rename: 'Rename', logout: 'Log out',
        connected: 'Connected', reconnecting: 'Reconnecting…',
        privacy: 'Privacy',
        privacyItems: ['Everything is stored locally in an SQLite database on this computer.', 'No Privé account, no Privé servers, no telemetry.', 'Network traffic goes only to the messaging networks you connect.'],
        dataPath: 'Your data lives in'
      },
      es: {
        sections: 'Secciones de configuración', back: 'Volver a la bandeja', title: 'Configuración',
        nav: ['General', 'Cuentas', 'Privacidad', 'Acerca de'],
        language: 'Idioma', languageHint: 'Por defecto usa el idioma del sistema. Se guarda solo en este equipo.',
        system: 'Predeterminado del sistema', theme: 'Tema', themes: ['Sistema', 'Claro', 'Oscuro'],
        accounts: 'Cuentas', addAccount: 'Añadir cuenta', rename: 'Renombrar', logout: 'Cerrar sesión',
        connected: 'Conectada', reconnecting: 'Reconectando…',
        privacy: 'Privacidad',
        privacyItems: ['Todo se guarda localmente en una base de datos SQLite en este equipo.', 'Sin cuenta de Privé, sin servidores de Privé, sin telemetría.', 'El tráfico de red va solo a las redes de mensajería que conectes.'],
        dataPath: 'Tus datos están en'
      }
    };
  }

  renderVals() {
    var self = this;
    var st = this.state;
    var t = this.dict()[st.lang];

    var nav = t.nav.map(function (label, i) {
      return { label: label, bg: i === 0 ? '#1E2129' : 'transparent', fg: i === 0 ? '#ECEDF0' : '#A0A3AD', weight: i === 0 ? 600 : 500 };
    });

    var langs = [
      { id: 'system', label: t.system },
      { id: 'en', label: 'English' },
      { id: 'es', label: 'Español' }
    ].map(function (l) {
      var sel = (st.langChoice || 'en') === l.id;
      return Object.assign({}, l, {
        pressed: sel ? 'true' : 'false',
        border: sel ? '#8B9CFF' : '#6B6F7A',
        bg: sel ? '#262C52' : 'transparent',
        pick: function () { self.setState({ langChoice: l.id, lang: l.id === 'system' ? 'en' : l.id }); }
      });
    });

    var themes = ['system', 'light', 'dark'].map(function (id, i) {
      var sel = st.theme === id;
      return {
        label: t.themes[i],
        pressed: sel ? 'true' : 'false',
        bg: sel ? '#ECEDF0' : 'transparent',
        fg: sel ? '#0F1013' : '#A0A3AD',
        pick: function () { self.setState({ theme: id }); }
      };
    });

    var accounts = [
      { label: 'Personal', net: 'WhatsApp', remote: '+00 •••• ••12', color: '#3FB68B', ok: true },
      { label: 'Work', net: 'WhatsApp', remote: '+00 •••• ••47', color: '#E0A43A', ok: true },
      { label: 'Family', net: 'WhatsApp', remote: '+00 •••• ••83', color: '#D46A9A', ok: false },
      { label: 'Telegram', net: 'Telegram', remote: '@[username]', color: '#4AA3DF', ok: true }
    ].map(function (a, i) {
      return Object.assign({}, a, {
        initial: a.label.charAt(0),
        divider: i === 0 ? 'none' : '1px solid #22252C',
        state: a.ok ? t.connected : t.reconnecting,
        stateColor: a.ok ? '#5ED3B5' : '#F2A65A'
      });
    });

    return {
      t: t,
      nav: nav,
      langs: langs,
      themes: themes,
      accounts: accounts,
      privacy: t.privacyItems.map(function (text) { return { text: text }; })
    };
  }
}
</script>
</body>
</html>
