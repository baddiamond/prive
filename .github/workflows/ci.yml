name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the github.com/wailsapp/wails/v2 version in go.mod.
  WAILS_VERSION: v2.17.0
  # Ubuntu 24.04 ships WebKitGTK 4.1 only.
  GO_TAGS: webkit2_41

jobs:
  checks:
    name: Lint, vet and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet -tags "$GO_TAGS" ./...

      - name: go vet (macOS and Windows code paths)
        run: |
          GOOS=darwin go vet ./internal/...
          GOOS=windows go vet ./internal/...

      - name: go test
        run: go test -race -tags "$GO_TAGS" ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Wails bindings
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          wails generate module -tags "$GO_TAGS"

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend build
        working-directory: frontend
        run: npm run build
